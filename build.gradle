plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}


tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}


def interFontFile = file('src/main/resources/assets/swiftvisuals/font/inter.ttf')
def interLicenseFile = file('src/main/resources/assets/swiftvisuals/font/OFL.txt')
def interArchiveFile = layout.buildDirectory.file('downloads/Inter-4.1.zip').get().asFile

tasks.register('downloadInterFont') {
    outputs.files(interFontFile, interLicenseFile)
    outputs.upToDateWhen { false }
    doLast {
        interFontFile.parentFile.mkdirs()
        interArchiveFile.parentFile.mkdirs()

        // Use the static TTF: Minecraft's TTF provider may not render variable fonts.
        new URL('https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip').withInputStream { input ->
            interArchiveFile.withOutputStream { output -> output << input }
        }

        def archive = new java.util.zip.ZipFile(interArchiveFile)
        try {
            def fontEntry = archive.getEntry('extras/ttf/Inter-Regular.ttf')
            if (fontEntry == null) {
                throw new GradleException('Inter-Regular.ttf was not found in the official Inter archive')
            }
            archive.getInputStream(fontEntry).withCloseable { input ->
                interFontFile.withOutputStream { output -> output << input }
            }

            def licenseEntry = archive.getEntry('LICENSE.txt')
            if (licenseEntry == null) {
                throw new GradleException('Inter OFL license was not found in the official Inter archive')
            }
            archive.getInputStream(licenseEntry).withCloseable { input ->
                interLicenseFile.withOutputStream { output -> output << input }
            }
        } finally {
            archive.close()
            interArchiveFile.delete()
        }

        if (!interFontFile.exists() || interFontFile.length() == 0) {
            throw new GradleException('Failed to extract static Inter-Regular.ttf')
        }
        if (!interLicenseFile.exists() || interLicenseFile.length() == 0) {
            throw new GradleException('Failed to extract Inter OFL license')
        }
    }
}

def downloadInterFontTask = tasks.named('downloadInterFont')
processResources.dependsOn downloadInterFontTask
tasks.named('sourcesJar').configure {
    dependsOn downloadInterFontTask
}
