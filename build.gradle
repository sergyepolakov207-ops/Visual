plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Fetch the open-source Inter variable font during the build so users do not need to install it.
def interFontFile = file("src/main/resources/assets/swift/font/inter.ttf")
tasks.register("downloadInterFont") {
    outputs.file(interFontFile)
    doLast {
        if (!interFontFile.exists()) {
            interFontFile.parentFile.mkdirs()
            new URL("https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf").withInputStream { input ->
                interFontFile.withOutputStream { output -> output << input }
            }
        }
    }
}

processResources {
    dependsOn tasks.named("downloadInterFont")
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}


tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.named("sourcesJar") {
    dependsOn tasks.named("downloadInterFont")
}
